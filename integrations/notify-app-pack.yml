name: Notify App Pack

# Lives in manuel-rtsch/Sidetrack as .github/workflows/notify-app-pack.yml.
# It is kept here, next to the pack it talks to, so the two halves of the
# contract are edited in one place.
#
# When a release is published, ask the pack to rebuild so SP-01 users get the
# update straight away instead of waiting for the pack's weekly cron. Nothing in
# the release depends on it: if this job fails, the APK release is still fine and
# the pack self-heals within a week.
#
# Triggers on the release *event*, so it fires however the release was cut: the
# web UI, `gh release create`, or the API.
#
# Required secret in manuel-rtsch/Sidetrack:
#   APP_PACK_DISPATCH_TOKEN — a fine-grained PAT with contents:write on
#   manuel-rtsch/sidetrack-pack and nothing else. GITHUB_TOKEN cannot dispatch
#   to a different repository.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the pack to rebuild
        env:
          TOKEN: ${{ secrets.APP_PACK_DISPATCH_TOKEN }}
          SRC_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret APP_PACK_DISPATCH_TOKEN is not set." \
                 "The release published fine; the App Pack will pick it up on its" \
                 "weekly cron, or immediately via workflow_dispatch on sidetrack-pack."
            exit 1
          fi

          # The pack build is stateless — it always fetches whatever is the latest
          # release — so this payload is informational only. It is passed through
          # env rather than interpolated into the shell, so a tag name can never
          # become part of the command.
          payload=$(jq -n --arg repo "$SRC_REPO" --arg tag "$TAG" \
            '{event_type: "app-released", client_payload: {repo: $repo, tag: $tag}}')

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/manuel-rtsch/sidetrack-pack/dispatches \
            -d "$payload"

          echo "Dispatched app-released for $SRC_REPO $TAG"
