# Metadata for the Sidetrack APK served by this pack.
#
# An APK with no metadata/<package>.yml is SILENTLY dropped from the index with
# only a warning, so this file is load-bearing. scripts/verify-index.py fails
# the build if the package is missing.
#
# The values that matter for trust are derived by `fdroid update` from the APK
# itself (versionCode, signer); everything here is presentation.

