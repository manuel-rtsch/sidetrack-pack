AutoName: Sidetrack

Summary: Keypad-first music player for Spotify, Plex, Jellyfin, Subsonic

Description: |-
  Sidetrack is a music player for Android 12 and later, built around the
  keypad of the Sidephone SP-01. Every action can be reached without touching
  the screen, and touch works as well. If the Sidekit launcher is installed,
  Sidetrack follows its theme, accent, input mode and key mappings.

  It connects to one service at a time: Spotify, Plex, Jellyfin, or a
  Subsonic-compatible server such as Navidrome or Nextcloud Music. Features a
  service does not support, such as podcasts or playlist creation, are not
  available for it.

  Spotify needs a Premium account for playback. Jellyfin needs a 12.x server
  with a music library. Plex needs a claimed Plex Media Server. Podcasts and
  gapless playback are available on Spotify only, and Plex has no song radio.

  Sidetrack is an independent project. It is not made by or affiliated with
  Sidephone, Spotify, Plex, Jellyfin or any other service it connects to.
