AutoName: Sidetrack

Summary: Keypad-first music player for the Sidephone SP-01

Description: |-
  Sidetrack is a capable music player built on the Sidekit SDK and designed for
  the Sidephone SP-01. The whole app is optimised for its small display, and
  every action has a keypad path: T9, mini QWERTY, Sundial and game-controller
  input are supported, with keypad navigation throughout. When Sidekit is
  installed, Sidetrack follows the launcher's theme, accent, input mode and key
  mappings; it also runs on its own on any Android 12+ phone.

  It connects to one service at a time and remembers the choice: Spotify, the
  Subsonic family (Navidrome, Nextcloud Music, Subsonic and anything else
  speaking OpenSubsonic), Jellyfin, and Plex. Capabilities vary by service, so
  podcasts, artist following, gapless playback or playlist creation appear only
  where the service supports them.

  Sidetrack is an independent project. It is not made by or affiliated with any
  of the music services it connects to.
